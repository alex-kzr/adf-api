[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adf-api"
version = "0.0.1"
description = "ADF diagnostic foundation scaffold"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
